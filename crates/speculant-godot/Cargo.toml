[package]
name = "speculant-godot"
description = "Мост gdext: отдаёт состояние ядра в Godot и принимает команды игрока."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib"]

[dependencies]
godot = { version = "0.5.5", features = ["api-4-7"] }
serde_json = "1.0.154"
speculant-core = { path = "../speculant-core" }
