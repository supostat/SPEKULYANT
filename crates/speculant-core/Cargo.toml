[package]
name = "speculant-core"
description = "Ядро симуляции «Спекулянта»: мир, экономика, события. Без зависимости от Godot."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
libm = "0.2.16"
rand_chacha = "0.10.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
