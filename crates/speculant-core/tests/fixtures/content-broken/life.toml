# Жизнь персонажа (§11, решение 15.4): скрытая шкала здоровья с видимыми состояниями, старение,
# деньги под матрасом, зачёт жилья и итоги. Калибровка — в фазе симулятора.

health_max = 100
start_health = 150
# Состояния здоровья снизу вверх: с какого значения какое слово видит игрок.
health_states = [
  { from = 1, name = "при смерти" },
  { from = 20, name = "плох" },
  { from = 45, name = "пошаливает сердце" },
  { from = 75, name = "здоров" },
]
aging_from = 35            # с этого дня рождения здоровье каждый год убывает
aging_per_year = 3
health_ending = "death_health"

stash_loss_share = 1.0     # кража или пожар уносят всё, что лежит под матрасом
resale_share = 0.8         # прежнее жильё идёт в зачёт по 80% цены
capital_in_dollars_from = "1992-01-01"
newspaper_pages = 16
business_sentence = "В {year} году завёл своё дело — «{business}»."

[names]
surnames = [
  "Лыков", "Кузнецов", "Смирнов", "Волков", "Зайцев", "Морозов", "Козлов", "Лебедев",
  "Новиков", "Соколов", "Попов", "Орлов", "Макаров", "Фролов", "Белов", "Тихонов",
]
first_names = [
  "Пётр", "Андрей", "Сергей", "Михаил", "Алексей", "Дмитрий", "Николай", "Владимир",
  "Игорь", "Олег", "Виктор", "Юрий", "Геннадий", "Валерий", "Борис", "Павел",
]
patronymics = [
  "Сергеевич", "Иванович", "Петрович", "Николаевич", "Васильевич", "Александрович",
  "Михайлович", "Викторович", "Юрьевич", "Борисович", "Андреевич", "Владимирович",
]
