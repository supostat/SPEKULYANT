# Толкучка (§5.2 п. 3): как цена отвечает на запас и как рынок приходит в себя после крупной
# сделки. Доли — от средней цены товара или от его обычного запаса. Спред и крутизна подобраны
# замером выгоды рейсов (спека living-market, 2026-10-20): хороший рейс окупает дорогу, а партия
# дорогого товара в одну-две штуки по-прежнему двигает цену резко — оборот держит запас толкучки.

spread = 0.04       # разница цен покупки и продажи
recovery = 0.15     # доля отклонения запаса от обычного, которую рынок выбирает за день
daily_noise = 0.1   # случайное колебание запаса за день
elasticity = 0.5    # крутизна отклика цены на запас: пустой рынок дороже средней в 2^0,5 ≈ 1,41 раза
