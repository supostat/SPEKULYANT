# Дефициты и завалы толкучек (§5.2 п. 4): рынок сам по сиду мира рождает временные шоки «город ×
# товар» — дефицит поднимает цену, завал опускает. Родился в городе игрока — строка в ленте; в
# других городах — слухи, и часть слухов путает город.

daily_chance = 0.15        # вероятность, что в этот день где-то случится дефицит или завал
deficit_share = 0.5        # доля дефицитов, остальное — завалы
deficit_factor = { from = 1.4, to = 2.0 }   # во сколько раз дефицит поднимает цену
glut_factor = { from = 0.5, to = 0.75 }     # во сколько раз завал опускает цену
days = { from = 14, to = 45 }               # сколько дней держится
rumor_accuracy = 0.8       # доля слухов, которые называют город верно
rumors = 2                 # сколько самых свежих слухов о ценах помнит окно «Слухи»: слух — две строки
