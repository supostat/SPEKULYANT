# Пороги объёма, баланса и покрытия — только здесь, никогда в коде и критериях. Игра этот файл не
# читает: его читают `cargo xtask content-count`, `cargo xtask balance-check` и валидатор покрытия.

# Объём контента (решения 15.1, 15.2 и 15.11): сколько сущностей вида должно быть в data/.
[volume]
goods = 40
cities = 10
npc = 20                  # шаблоны соперников — люди со стратегией
zone_events = 40
post2004_templates = 20

[volume.events]
stagnation = 70
perestroika = 70
wild_market = 90
stabilization = 60

# Баланс: пороги сняты калибровкой от базы симулятора (вариант «с запасом от базы»). В базе нет ни
# смертей, ни событий — их пороги заданы целями: тишина — от daily_chance в event_rules.toml
# (событие раз в 6,7 дня), смертность — потолок, при котором к 2005 году бедой кончается не больше
# ~56% жизней. Перекос стратегий в базе: предприниматель к концу перестройки — 108 общих медиан.
# calibrated: seed 1, lives 600, 2026-10-19
# 2026-10-20: события реже — daily_chance 0.08 (раз в ~12,5 дня) вместо 0.15, пороги тишины те же.
[balance]
seed = 1                  # прогон cargo xtask balance-check
lives = 200
breaking_medians = 20.0   # медиана капитала стратегии к концу эпохи — не больше стольких общих

[balance.mortality]       # бед (смерть, срок, разорение) на жизне-год — не больше
stagnation = 0.02
perestroika = 0.03
wild_market = 0.06
stabilization = 0.03

[balance.quiet_days]      # дней жизни на одно событие — не больше
stagnation = 20.0
perestroika = 20.0
wild_market = 15.0
stabilization = 20.0

# Торговля (спека living-market): хороший рейс окупает дорогу, но перекупщик не ломает экономику.
# trip_return — медиана по неделям эпохи прибыли лучшего рейса к кошельку purse (рубли 1984 года)
# по открытым маршрутам из открытых городов при обычном запасе толкучек; цель — 20–60%.
# arbitrage_over_random — во сколько раз медиана капитала арбитражника к концу эпохи выше медианы
# случайного бота, который не торгует с толком; пределы — от половины базы до трёх баз, но не ниже
# перевеса до калибровки, когда торговля не окупалась. Боты-перекупщики после рейса несколько дней
# живут дома, как игрок, — иначе события города их не находят.
# calibrated: seed 1, lives 200, 2026-10-20 — выгода рейса 24,9 / 23,6 / 26,8 / 39,2%, перевес
# 10,2 / 9,0 / 2,4 / 5,7 раза (до калибровки: 1,1 / 0,6 / 0,2 / −0,2% и 2,8 / 2,7 / 1,6 / 2,4).
[trade]
purse = 500
trip_return = { from = 0.2, to = 0.6 }

[trade.arbitrage_over_random]
stagnation = { from = 6.0, to = 36.0 }
perestroika = { from = 5.0, to = 32.0 }
wild_market = { from = 1.8, to = 8.0 }
stabilization = { from = 3.0, to = 19.0 }

# Покрытие: столько жизней прогоняет валидатор, прежде чем назвать событие мёртвым. Боты этого
# прогона любопытны: в доле решений выбирают наугад, не кончая жизнь, — иначе вложения, отказы и
# долги, которых манера бота не выбирает, выглядели бы мёртвыми. Замер баланса идёт без любопытства.
# 2026-10-20: события реже (daily_chance 0.08) — четыре события редких состояний (райком, олигарх,
# «шестисотый», угроза на пейджер) встречаются только к 1200 жизням, поэтому прогон вдвое длиннее.
[coverage]
lives = 1200
curiosity = 0.1
