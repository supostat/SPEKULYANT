title = "Разговор у кума"
weight = 4
cooldown_days = 365
text = """
Начальник оперчасти угощает «Беломором» и говорит по-отечески: «Ты человек грамотный, \
торговый. Мне нужно знать, что в отряде творится. А я про УДО похлопочу»."""

[conditions]
epochs = ["stagnation", "perestroika"]

[[choices]]
text = "Согласиться стучать"
outcome = "Кум доволен. Отряд пока ничего не знает."

[choices.consequences]
zone = { authority = -1, term_months = -3 }
reputation = [{ faction = "militia", change = 1 }, { faction = "bandits", change = -2 }]

[[choices]]
text = "Отказаться наотрез"
outcome = "«Ну смотри, грамотный», — кум убирает папиросы."

[choices.consequences]
zone = { authority = 1 }
set_flags = ["kum_grudge"]

[[choices.follow_ups]]
event = "kum_pressure"
after_days = 30
chance = 0.5

[[choices]]
text = "Сказаться дураком"
outcome = "Кум долго смотрит и отпускает: с дурака спроса нет."
