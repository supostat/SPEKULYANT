title = "Валютчик по восемьдесят восьмой"
weight = 3
once = true
text = """
В отряд пришёл валютчик с Невского — по восемьдесят восьмой статье. Он клянётся, что через \
пять лет доллар будет продаваться в каждом ларьке."""

[conditions]
epochs = ["stagnation", "perestroika"]

[[choices]]
text = "Записать его адрес"
outcome = "Валютчик подмигивает: искать его у гостиницы «Европейская»."

[choices.consequences]
reputation = [{ faction = "traders", change = 1 }]

[[choices]]
text = "Посмеяться над фантазёром"
outcome = "Валютчик не обижается: «Посмотрим»."
