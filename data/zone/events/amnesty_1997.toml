title = "Амнистия девяносто седьмого года"
weight = 8
once = true
text = """
Дума объявила амнистию перед Новым годом: колонии переполнены, кормить нечем. Под указ \
попадают «экономические» статьи."""

[conditions]
window = { from = "1997-12-24", until = "1998-07-01" }
authority = { at_most = 3 }

[[choices]]
text = "Собрать вещи"
outcome = "Ворота открылись. За ними — воля."

[choices.consequences]
zone = { amnesty = true }
