title = "Амнистия к 40-летию Победы"
weight = 8
once = true
text = """
Зачитали Указ Президиума Верховного Совета об амнистии к сорокалетию Победы. Под неё \
попадают впервые осуждённые с небольшими сроками."""

[conditions]
window = { from = "1985-03-27", until = "1985-10-01" }
authority = { at_most = 3 }

[[choices]]
text = "Собрать вещи"
outcome = "Ворота открылись. За ними — воля."

[choices.consequences]
zone = { amnesty = true }
