title = "Грев от братвы"
weight = 4
cooldown_days = 180
text = """
С воли пришёл грев: блок сигарет, чай, сало. На записке — привет от людей, которых ты \
знаешь по рынку. Даром такое не греют."""

[conditions]
epochs = ["wild_market"]

