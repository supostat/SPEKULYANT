title = "Ночной шмон"
weight = 4
cooldown_days = 120
text = """
Ночью барак поднимают: шмон. Контролёры вытряхивают матрасы, ищут заточки, водку, лишний \
чай. Твоя тумбочка — следующая."""

[[choices]]
text = "Сунуть контролёру пачку"
outcome = "Контролёр прошёл мимо твоей тумбочки."

[choices.consequences]
zone = { cigarettes = -5 }

[[choices]]
text = "Перепрятать чай соседу"
outcome = "Сосед спрятал. Утром отдал — почти весь."

[choices.consequences]
zone = { tea = -1 }

[[choices]]
text = "Стоять у стены"
outcome = "Нашли лезвие у соседа. Тебя не тронули — в этот раз."
