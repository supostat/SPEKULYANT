title = "Нашли в посылке"
weight = 1
text = """
Оперчасть вскрыла очередную посылку на твоё имя. Внутри — то, о чём ты не спрашивал. Кум \
раскладывает пакетики на столе."""

[conditions]
flags_set = ["heroin_parcel"]

[[choices]]
text = "Взять всё на себя"
outcome = "Новое дело, новый срок. Зона это оценит."

[choices.consequences]
zone = { term_months = 12, authority = 1 }
reputation = [{ faction = "bandits", change = 2 }]
clear_flags = ["heroin_parcel"]

[[choices]]
text = "Назвать отправителя"
outcome = """
Тебе — полгода сверху, смотрящему — новый срок. Спать теперь придётся вполглаза."""

[choices.consequences]
zone = { term_months = 6, authority = -2 }
reputation = [{ faction = "militia", change = 1 }, { faction = "bandits", change = -3 }]
clear_flags = ["heroin_parcel"]
