title = "Обмен чая на курево"
weight = 5
cooldown_days = 60
text = """
Барыга барака меняет чай на сигареты и обратно. Курс сегодня хороший — для того, кто \
знает, чего ему не хватает."""

[[choices]]
text = "Сменять чай на курево"
outcome = "Пачка чая ушла, блок курева пришёл."

[choices.consequences]
zone = { tea = -1, cigarettes = 6 }

[[choices]]
text = "Сменять курево на чай"
outcome = "Пачка чая на полке — значит, будет и чифир."

[choices.consequences]
zone = { cigarettes = -6, tea = 1 }

[[choices]]
text = "Не меняться"
outcome = "Барыга сам себе барыга. Ты тут по другой части."
