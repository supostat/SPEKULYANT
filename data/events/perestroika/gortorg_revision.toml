text = """
Знакомый кооператор в панике: завтра ревизия горторга, а у него на складе неучтённый \
товар. Просит спрятать у тебя."""

[[choices]]
text = "Спрятать"
outcome = "Три коробки неделю стоят у тебя под кроватью. Кооператор благодарит деньгами."

[choices.consequences]
money = 80
reputation = [{ faction = "traders", change = 1 }, { faction = "militia", change = -1 }]

[[choices]]
text = "Отказать"
outcome = "Кооператор находит другого. Или не находит."
