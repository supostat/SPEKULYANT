title = "Брокерское место"
weight = 4
once = true
text = """
На товарно-сырьевой бирже продают брокерские места. Там сводят вагоны сахара с заводами, \
которым нужен лес."""

[conditions]
window = { from = "1990-11-01" }
money = { at_least = 1000 }

[[choices]]
text = "Купить место"
outcome = "Тебе выдают пропуск и красный пиджак не выдают."

[choices.consequences]
money = -1000
set_flags = ["broker"]

[[choices]]
text = "Не играть в биржу"
outcome = "Пусть сводят без тебя."
