money = -10
reputation = [{ faction = "people", change = 1 }]

[[choices]]
text = "Донести"
outcome = "Соседа штрафуют, аппарат конфискуют. На кухне с тобой больше не здороваются."

[choices.consequences]
reputation = [{ faction = "militia", change = 1 }, { faction = "people", change = -2 }]

[[choices]]
text = "Не вмешиваться"
outcome = "Брагой пахнет весь подъезд."
