set_flags = ["berezka_checks"]

[[choices.follow_ups]]
event = "checks_traced"
after_days = 30
chance = 0.25

[[choices]]
text = "Не связываться с чеками"
outcome = "Чеки — это статья. Пусть рискуют другие."
