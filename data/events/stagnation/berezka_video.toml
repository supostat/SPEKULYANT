title = "Видик через чеки"
weight = 3
once = true
text = """
Знакомый моряка продаёт чеки «Внешпосылторга»: на них в «Берёзке» стоит видеомагнитофон, \
за который на толкучке дают тысячу двести."""

[conditions]
money = { at_least = 900 }

[[choices]]
text = "Купить чеки и видик"
