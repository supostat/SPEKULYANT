title = "Станки из Китая"
weight = 5
once = true
text = """
В Китае продают станки дешевле, чем ремонт старых советских. Можно наладить своё \
производство."""

[conditions]
money = { at_least = 2500 }

[[choices]]
text = "Купить линию и запустить цех"
outcome = "Станки гудят. Ты — производитель."

[choices.consequences]
money = -2000
set_flags = ["factory"]

[[choices]]
text = "Торговать дальше"
outcome = "Производить — долго и сложно."
