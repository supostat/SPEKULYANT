# Дела (§7): шкала прогноза, черты сотрудников и шансы происшествий. Деньги — рубли 1984 года,
# шансы — в месяц; калибровка — в фазе симулятора.

# Уровни риска прогноза снизу вверх — как на экране управляющего.
risk_levels = [
  { name = "низкий", monthly_chance = 0.02 },
  { name = "умеренный", monthly_chance = 0.05 },
  { name = "средний", monthly_chance = 0.1 },
  { name = "высокий", monthly_chance = 0.2 },
  { name = "очень высокий", monthly_chance = 0.35 },
]
alarm_level = 3       # с этого уровня прогноз красный
base_raid = 2
base_theft = 2

trait_scale = 5       # черты — деления от 1 до 5
neutral_trait = 3     # середина ничего не сдвигает
skill_step = 0.1      # хватка: ±10% выручки за деление от середины

revenue_noise = 0.1   # выручка месяца ±10%
theft_share = 0.15    # недостача — 15% выручки месяца
bribe_share = 0.1     # откуп на проверке — 10% месячной выручки
closure_days = 3      # закрылись на проверку

roof_raise_chance = 0.04
fire_chance = 0.005
# Уход и предательство управляющего — по делениям лояльности от 1 до 5.
departure_chances = [0.08, 0.04, 0.02, 0.01, 0.0]
betrayal_chances = [0.03, 0.015, 0.005, 0.0, 0.0]

fired_relation = -2   # уволенный обижен
competition = 0.1     # точка соперника того же типа в городе: выручка × 1 / (1 + 0,1·n)
rival_reserve = 1.0   # соперник открывает точку, если после неё останется ещё одна цена точки
