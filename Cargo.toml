[workspace]
resolver = "2"
members = [
    "crates/speculant-core",
    "crates/speculant-sim",
    "crates/speculant-validate",
    "crates/speculant-godot",
    "crates/xtask",
]

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.94"
publish = false

# Симулятор и проверка баланса гоняют сотни жизней и в отладочной сборке: ядро и симулятор
# оптимизируются всегда, остальное собирается как обычно.
[profile.dev.package.speculant-core]
opt-level = 3

[profile.dev.package.speculant-sim]
opt-level = 3
