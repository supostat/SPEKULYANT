name: ci

on:
  push:
  pull_request:

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Тулчейн Rust из rust-toolchain.toml
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Кэш пина Godot
        uses: actions/cache@v4
        with:
          path: .tools/godot
          key: godot-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tools.toml') }}
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: cargo run -p speculant-validate -- data --strict
      - name: Двести жизней ботов на настоящем ядре и данных
        run: cargo run -p speculant-sim -- --lives 200 --seed 1
      - name: Покрытие событий прогоном любопытных ботов
        if: runner.os == 'Linux'
        run: cargo xtask coverage-check
      - run: cargo xtask godot-fetch
      - run: cargo xtask godot-check
      - run: cargo xtask gd-check
      - run: cargo xtask deps-check
      - run: cargo xtask version-check
      - run: cargo xtask docs-check
      - run: cargo xtask charset-check
      - run: cargo xtask etalons --check
      - run: cargo xtask screen-check boot
      - run: cargo xtask screen-check market
      - run: cargo xtask screen-check event
      - run: cargo xtask screen-check manager
      - run: cargo xtask screen-check pager
      - run: cargo xtask screen-check end
      - run: cargo xtask screen-smoke all
      - run: cargo xtask ui-flow-smoke
      - run: cargo xtask sound-smoke
      - run: cargo xtask bridge-smoke --full
      - name: PNG заставки под Xvfb
        if: runner.os == 'Linux'
        run: xvfb-run -a cargo xtask screenshot boot
      - name: Снимки экранов
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: .tools/out/*.png
